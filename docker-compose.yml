services:
  terraria-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraria-panel
    ports:
      - "80:8080"
      - "7777:7777"
    volumes:
      # Config files
      - ./config.yaml:/app/config.yaml
      - ./config/config.txt:/app/config/config.txt
      # Terraria server files
      - ./Terraria-1449:/app/Terraria-1449
      # Data persistence
      - ./data/worlds:/app/worlds
      - ./data/backups:/app/backups
      - ./logs:/app/logs
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - terraria-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/game/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  terraria-net:
    driver: bridge
