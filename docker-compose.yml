version: '3.8'

services:
  terraria-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraria-panel
    ports:
      - "8084:8080"
      - "7777:7777"  # Terraria default game port
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./config.txt:/app/config.txt
      - ./Terraria:/app/Terraria
      - ./Terraria-1449:/app/Terraria-1449
      - ./logs:/app/logs
      #- ./worlds:/app/worlds
    environment:
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - terraria-net

networks:
  terraria-net:
    driver: bridge
